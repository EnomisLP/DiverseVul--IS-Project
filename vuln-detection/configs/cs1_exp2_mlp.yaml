# CS1-EXP2-MLP: proposal-aligned shallow neural classifier
experiment_name: cs1_exp2_mlp_inner_dev_grouped

protocol:
  outer_holdout: frozen_project_disjoint_approximately_20_percent
  development_cv: frozen_5_fold_stratified_group_kfold
  inner_validation: project_disjoint_stratified_group_split_inside_each_outer_train_fold
  primary_selection_metric: average_precision_pr_auc
  final_outer_holdout: locked_until_all_case_study_1_candidates_are_compared

representation:
  code_column: normalized_code
  word_tfidf:
    ngram_range: [1, 3]
    min_df: 3
    max_df: 0.995
    max_features: 50000
  char_tfidf:
    analyzer: char
    ngram_range: [3, 4]
    min_df: 8
    max_df: 0.995
    max_features: 60000
  svd:
    n_components: 256
    algorithm: randomized
    n_iter: 5
    n_oversamples: 10
  static_features:
    source: cs1-exp1-static-features-v1
    count: 54
  scaler:
    type: StandardScaler
    fit_scope: inner_optimisation_partition_only

mlp:
  architecture: [310, 128, 64, 1]
  activations: [ReLU, ReLU, sigmoid_at_inference]
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 15
  early_stopping_monitor: validation_pr_auc
  early_stopping_patience: 3
  imbalance_loss: BCEWithLogitsLoss_pos_weight_negative_over_positive
  batch_size_gpu: 2048
  batch_size_cpu: 1024
  device: auto

threshold:
  selection_source: inner_project_validation_predictions_only
  objective: f1
  grid: [0.01, 0.99, 0.01]
